# Example SecretProviderClass for Azure Key Vault certificate -> Kubernetes TLS secret
# Requires Secrets Store CSI driver + Azure provider and Workload Identity configuration.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-api-keyvault-tls
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_WITH_AZURE_WORKLOAD_IDENTITY_CLIENT_ID"
    keyvaultName: "REPLACE_WITH_KEYVAULT_NAME"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: "REPLACE_WITH_CERTIFICATE_NAME"
          objectType: "certificate"
    tenantId: "REPLACE_WITH_TENANT_ID"
  secretObjects:
    - secretName: demo-api-tls
      type: kubernetes.io/tls
      data:
        - objectName: "REPLACE_WITH_CERTIFICATE_NAME"
          key: tls.key
        - objectName: "REPLACE_WITH_CERTIFICATE_NAME"
          key: tls.crt
